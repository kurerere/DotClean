name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon runner
            label: macos-arm64
          - platform: windows-latest
            label: windows-amd64

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Tags like v1.2.3 / 1.2.3 override the app version so artifacts match the tag.
      - name: Set version from tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            node -e '
              const fs = require("fs");
              const p = "src-tauri/tauri.conf.json";
              const c = JSON.parse(fs.readFileSync(p, "utf8"));
              c.version = process.argv[1];
              fs.writeFileSync(p, JSON.stringify(c, null, 2));
            ' "$v"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DotClean ${{ github.ref_name }}
          releaseBody: See the assets below to download DotClean for macOS (Apple Silicon) and Windows (x64).
          releaseDraft: false
          prerelease: false
